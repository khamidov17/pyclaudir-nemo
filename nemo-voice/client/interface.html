<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Nemo Voice</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #131318;
      color: #fff;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .orb-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
      opacity: 0;
      transition: opacity 0.6s, transform 0.4s, border-color 0.6s;
    }
    .ring-1 { width: 220px; height: 220px; }
    .ring-2 { width: 260px; height: 260px; }
    .ring-3 { width: 300px; height: 300px; }

    .orb-core {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      transition: transform 0.3s ease, box-shadow 0.4s ease;
    }

    .orb-glow {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0;
      z-index: 1;
      transition: opacity 0.5s;
    }

    /* ── Idle ── */
    [data-state="idle"] .orb-core {
      background: conic-gradient(from 0deg, #555, #333, #555);
      box-shadow: 0 0 30px rgba(66,133,244,0.15);
      animation: gentle-rotate 8s linear infinite;
    }
    [data-state="idle"] .orb-glow { opacity: 0.15; background: #4285f4; }

    /* ── Connecting ── */
    [data-state="connecting"] .orb-core {
      background: conic-gradient(from 0deg, #4285f4, #9b72cb, #d96570, #d96570, #9b72cb, #4285f4);
      animation: spin 3s linear infinite;
      box-shadow: 0 0 40px rgba(66,133,244,0.3);
    }
    [data-state="connecting"] .orb-glow { opacity: 0.3; background: #4285f4; }

    /* ── Listening ── */
    [data-state="listening"] .orb-core {
      background: conic-gradient(from 0deg, #4285f4, #9b72cb, #d96570, #fbbc04, #34a853, #4285f4);
      box-shadow: 0 0 50px rgba(66,133,244,0.25), 0 0 100px rgba(155,114,203,0.1);
      animation: gentle-rotate 8s linear infinite;
    }
    [data-state="listening"] .orb-glow {
      opacity: 0.25;
      background: radial-gradient(circle, #4285f4, #9b72cb);
      animation: glow-breathe 4s ease-in-out infinite;
    }
    [data-state="listening"] .ring { border-color: rgba(66,133,244,0.08); opacity: 0.4; }

    /* ── User speaking ── */
    [data-state="user-speaking"] .orb-core {
      background: conic-gradient(from 0deg, #34a853, #4285f4, #9b72cb, #34a853);
      box-shadow: 0 0 60px rgba(52,168,83,0.3), 0 0 120px rgba(66,133,244,0.15);
      transform: scale(1.08);
      animation: gentle-rotate 4s linear infinite;
    }
    [data-state="user-speaking"] .orb-glow {
      opacity: 0.5;
      background: radial-gradient(circle, #34a853, #4285f4);
      animation: glow-breathe 1.5s ease-in-out infinite;
    }
    [data-state="user-speaking"] .ring { opacity: 0.6; }
    [data-state="user-speaking"] .ring-1 { border-color: rgba(52,168,83,0.3); animation: ring-expand 2s ease-out infinite; }
    [data-state="user-speaking"] .ring-2 { border-color: rgba(66,133,244,0.2); animation: ring-expand 2s ease-out 0.4s infinite; }
    [data-state="user-speaking"] .ring-3 { border-color: rgba(155,114,203,0.1); animation: ring-expand 2s ease-out 0.8s infinite; }

    /* ── AI speaking ── */
    [data-state="ai-speaking"] .orb-core {
      background: conic-gradient(from 0deg, #4285f4, #9b72cb, #d96570, #fbbc04, #34a853, #4285f4);
      box-shadow: 0 0 80px rgba(66,133,244,0.4), 0 0 150px rgba(155,114,203,0.2);
      transform: scale(1.12);
      animation: ai-spin 2s linear infinite;
    }
    [data-state="ai-speaking"] .orb-glow {
      opacity: 0.7;
      background: radial-gradient(circle, #4285f4, #9b72cb, #d96570);
      animation: glow-pulse 1s ease-in-out infinite;
    }
    [data-state="ai-speaking"] .ring { opacity: 0.8; }
    [data-state="ai-speaking"] .ring-1 { border-color: rgba(66,133,244,0.4); animation: ring-pulse 1.2s ease-in-out infinite; }
    [data-state="ai-speaking"] .ring-2 { border-color: rgba(155,114,203,0.3); animation: ring-pulse 1.2s ease-in-out 0.2s infinite; }
    [data-state="ai-speaking"] .ring-3 { border-color: rgba(217,101,112,0.2); animation: ring-pulse 1.2s ease-in-out 0.4s infinite; }

    /* ── Error ── */
    [data-state="error"] .orb-core {
      background: conic-gradient(from 0deg, #d96570, #aa3a44, #d96570);
      box-shadow: 0 0 40px rgba(217,101,112,0.2);
      animation: none;
    }
    [data-state="error"] .orb-glow { opacity: 0.2; background: #d96570; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes gentle-rotate { to { transform: rotate(360deg); } }
    @keyframes ai-spin { to { transform: scale(1.12) rotate(360deg); } }
    @keyframes glow-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes glow-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); opacity: 0.9; } }
    @keyframes ring-expand { 0% { transform: scale(0.9); opacity: 0.6; } 100% { transform: scale(1.15); opacity: 0; } }
    @keyframes ring-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    #status {
      position: fixed;
      bottom: 32px;
      left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    #status.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app" data-state="idle">
    <div class="orb-container" id="orb-wrap">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="orb-glow"></div>
      <div class="orb-core"></div>
    </div>
  </div>
  <div id="status"></div>

<script>
// =====================================================================
// Nemo Voice — ADK WebSocket Client with Orb UI
// Supports both anonymous (direct visit) and authenticated (Telegram mini app)
// =====================================================================

const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); tg.disableVerticalSwipes?.(); }

const app      = document.getElementById('app');
const statusEl = document.getElementById('status');
const orbWrap  = document.getElementById('orb-wrap');

// -- State --
let ws           = null;
let captureCtx   = null;
let playbackCtx  = null;
let mediaStream  = null;
let captureNode  = null;
let playbackNode = null;
let gainNode     = null;
let state        = 'idle';
let statusTimer  = null;
let userContext  = null; // null = anonymous, object = authenticated
let geoBlocked   = false;

const SPEAK_RMS = 0.008;

// Countries where Gemini API is NOT available
const BLOCKED_COUNTRIES = [
  'CN', 'RU', 'BY', 'IR', 'KP', 'CU', 'SY', 'MM', 'HK',
];

async function checkGeoRestriction() {
  try {
    const res = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(5000) });
    if (!res.ok) return true; // allow on error
    const data = await res.json();
    const code = (data.country_code || '').toUpperCase();
    const name = data.country_name || code;
    if (BLOCKED_COUNTRIES.includes(code)) {
      geoBlocked = true;
      setState('error');
      showStatus(`Sorry, you're in ${name} — not yet supported by Nemo Voice. We're working on it!`, 0);
      return false;
    }
    return true;
  } catch {
    return true; // allow on network error
  }
}

// -- UI --
function setState(s) {
  state = s;
  app.dataset.state = s;
}

function showStatus(msg, dur) {
  statusEl.textContent = msg;
  statusEl.classList.add('show');
  clearTimeout(statusTimer);
  if (dur) statusTimer = setTimeout(() => statusEl.classList.remove('show'), dur);
}

function hideStatus() { statusEl.classList.remove('show'); clearTimeout(statusTimer); }

// =====================================================================
// Auth — check if opened via Telegram mini app
// =====================================================================
async function fetchUserContext() {
  const initData = tg?.initData || '';
  if (!initData) return null; // Anonymous — no Telegram context

  try {
    const res = await fetch('/api/live-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    return {
      user_name: data.user_name || '',
      user_memory: data.user_memory || '',
      personality: data.personality || '',
      recent_messages: data.recent_messages || '',
      user_id: tg?.initDataUnsafe?.user?.id || 0,
    };
  } catch (e) {
    console.error('Auth failed:', e);
    return null;
  }
}

// =====================================================================
// WebSocket connection to ADK server
// =====================================================================
function connectToServer() {
  return new Promise((resolve, reject) => {
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${wsProtocol}//${window.location.host}/ws`;
    ws = new WebSocket(url);

    const timeout = setTimeout(() => { ws.close(); reject(new Error('Connection timed out')); }, 15000);

    ws.onopen = () => {};

    ws.onmessage = async (event) => {
      let data;
      try { data = JSON.parse(event.data); } catch { return; }

      if (data.type === 'ready') {
        clearTimeout(timeout);
        // Send auth context if we have it
        if (userContext) {
          ws.send(JSON.stringify({
            type: 'auth',
            user_id: userContext.user_id,
            user_name: userContext.user_name,
            user_memory: userContext.user_memory,
            personality: userContext.personality,
            recent_messages: userContext.recent_messages,
          }));
        }
        resolve();
        return;
      }

      if (data.type === 'audio') {
        playAudioChunk(data.data);
        if (state !== 'ai-speaking') setState('ai-speaking');
      }

      if (data.type === 'text') console.log('AI:', data.data);
      if (data.type === 'user_transcript') console.log('User:', data.data);
      if (data.type === 'turn_complete') setState('listening');

      if (data.type === 'interrupted') {
        interruptPlayback();
        setState('user-speaking');
      }

      if (data.type === 'session_id') console.log('Session:', data.data);
    };

    ws.onerror = () => {};
    ws.onclose = () => {
      clearTimeout(timeout);
      ws = null;
      if (state !== 'idle') {
        stopMic(); destroyPlayback();
        setState('error');
        showStatus('Disconnected — tap to reconnect', 0);
      }
    };
  });
}

// =====================================================================
// Mic capture via AudioWorklet (16kHz PCM16)
// =====================================================================
async function startMic() {
  if (!captureCtx) {
    captureCtx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 16000, latencyHint: 'interactive'
    });
  }
  if (captureCtx.state === 'suspended') await captureCtx.resume();

  await captureCtx.audioWorklet.addModule('/audio-processors/capture.worklet.js');

  mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });

  const source = captureCtx.createMediaStreamSource(mediaStream);
  captureNode = new AudioWorkletNode(captureCtx, 'capture-processor');

  captureNode.port.onmessage = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const { pcm, rms } = e.data;

    if (rms > SPEAK_RMS && state === 'listening') setState('user-speaking');
    else if (rms <= SPEAK_RMS && state === 'user-speaking') setState('listening');

    const bytes = new Uint8Array(pcm);
    let bin = '';
    for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);

    ws.send(JSON.stringify({ type: 'audio', data: btoa(bin) }));
  };

  source.connect(captureNode);
  const silentGain = captureCtx.createGain();
  silentGain.gain.value = 0;
  captureNode.connect(silentGain);
  silentGain.connect(captureCtx.destination);
}

function stopMic() {
  if (captureNode) { captureNode.disconnect(); captureNode = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (captureCtx) { captureCtx.close().catch(() => {}); captureCtx = null; }
}

// =====================================================================
// Playback via AudioWorklet (24kHz)
// =====================================================================
async function initPlayback() {
  if (playbackNode) return;
  playbackCtx = new (window.AudioContext || window.webkitAudioContext)({
    sampleRate: 24000, latencyHint: 'interactive'
  });
  await playbackCtx.audioWorklet.addModule('/audio-processors/playback.worklet.js');
  playbackNode = new AudioWorkletNode(playbackCtx, 'pcm-processor');
  gainNode = playbackCtx.createGain();
  gainNode.gain.value = 1.0;
  playbackNode.connect(gainNode);
  gainNode.connect(playbackCtx.destination);
}

function playAudioChunk(base64) {
  if (!playbackNode || !playbackCtx) return;
  if (playbackCtx.state === 'suspended') playbackCtx.resume();
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);
  const f32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
  playbackNode.port.postMessage(f32);
}

function interruptPlayback() {
  if (playbackNode) playbackNode.port.postMessage('interrupt');
}

function destroyPlayback() {
  if (playbackNode) { playbackNode.disconnect(); playbackNode = null; }
  if (gainNode) { gainNode.disconnect(); gainNode = null; }
  if (playbackCtx) { playbackCtx.close().catch(() => {}); playbackCtx = null; }
}

// =====================================================================
// Main
// =====================================================================
async function start() {
  if (geoBlocked) return;
  setState('connecting');
  showStatus('Connecting...', 0);
  destroyPlayback();

  try {
    // Check geo restriction on first connect
    const allowed = await checkGeoRestriction();
    if (!allowed) return;

    // Try to authenticate via Telegram if available
    userContext = await fetchUserContext();
    if (userContext) {
      console.log('Authenticated as:', userContext.user_name, '(id:', userContext.user_id, ')');
    } else {
      console.log('Anonymous session — limited tools');
    }

    await initPlayback();
    await connectToServer();
    await startMic();
    setState('listening');
    hideStatus();
  } catch (e) {
    setState('error');
    showStatus(e.message || 'Connection failed — tap to retry', 0);
  }
}

function disconnect() {
  setState('idle');
  stopMic(); destroyPlayback();
  if (ws) { ws.close(1000, 'user disconnect'); ws = null; }
  hideStatus();
  showStatus('Tap to connect', 2000);
}

orbWrap.addEventListener('click', () => {
  if (geoBlocked) return;
  if (state === 'idle' || state === 'error') start();
  else if (['listening', 'user-speaking', 'ai-speaking'].includes(state)) disconnect();
});

showStatus('Tap to connect', 0);
</script>
</body>
</html>
