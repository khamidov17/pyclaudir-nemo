<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemo Voice — test client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0F0F1A; color: #fff; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; padding: 24px;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .sub { color: #888; font-size: 12px; margin-bottom: 20px; }
    .row { display: flex; gap: 8px; width: 100%; max-width: 520px; margin-bottom: 10px; }
    input {
      flex: 1; background: #1A1A28; border: 1px solid #2A2A3A; color: #fff;
      border-radius: 8px; padding: 10px 12px; font-size: 14px;
    }
    button {
      background: #7C3AED; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.stop { background: #d23b54; }
    .orb {
      width: 120px; height: 120px; border-radius: 50%; margin: 24px 0;
      background: #1E1E2E; transition: all .25s; box-shadow: 0 0 0 rgba(124,58,237,0);
    }
    .orb.listening { background: #7C3AED; box-shadow: 0 0 40px 6px rgba(124,58,237,.4); }
    .orb.speaking  { background: #34a853; box-shadow: 0 0 50px 10px rgba(52,168,83,.5); transform: scale(1.08); }
    .orb.error     { background: #d23b54; }
    #state { font-size: 13px; color: #aaa; min-height: 18px; margin-bottom: 12px; }
    #log {
      width: 100%; max-width: 520px; flex: 1; overflow-y: auto;
      background: #14141F; border: 1px solid #222; border-radius: 10px;
      padding: 12px; font-size: 13px; line-height: 1.5;
    }
    .you { color: #cfcfe8; } .nemo { color: #b794f6; } .sys { color: #666; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Nemo Voice — backend test client</h1>
  <div class="sub">Streams mic → :3002 bridge → Deepgram, plays replies live. Proves the backend independent of the APK.</div>

  <div class="row">
    <input id="host" placeholder="host or full wss:// URL">
    <input id="port" placeholder="3002" style="max-width:90px">
  </div>
  <div class="row">
    <input id="token" type="password" placeholder="NEMO_APP_TOKEN">
    <button id="btn">Connect</button>
  </div>

  <div class="orb" id="orb"></div>
  <div id="state">idle</div>
  <div id="meter" style="font-family:monospace;font-size:13px;color:#555;letter-spacing:1px;margin-bottom:10px;min-height:18px"></div>
  <div id="log"></div>

<script>
// ── Nemo Voice test client. Mirrors the current streaming_service.py protocol:
//   send: {type:'auth',token}  then  {type:'audio',data:<b64 pcm16 16k>}
//   recv: ready | agent_audio_start | audio(b64 pcm16 24k) | turn_complete
//         | interrupted | user_transcript | text | error
// Playback is continuous (no whole-turn buffering); 'interrupted' flushes it.
const $ = (id) => document.getElementById(id);
const hostEl = $('host'), portEl = $('port'), tokenEl = $('token');
const btn = $('btn'), orb = $('orb'), stateEl = $('state'), logEl = $('log'), meterEl = $('meter');

const SAMPLE_IN = 16000, SAMPLE_OUT = 24000;
let ws = null, micCtx = null, micStream = null, micNode = null, micSource = null;
let playCtx = null, playNode = null, connected = false;

// Restore last-used values.
hostEl.value = localStorage.getItem('nemo_host') || location.hostname || 'localhost';
portEl.value = localStorage.getItem('nemo_port') || '3002';
tokenEl.value = localStorage.getItem('nemo_token') || '';
const q = new URLSearchParams(location.search);
if (q.get('host')) hostEl.value = q.get('host');
if (q.get('token')) tokenEl.value = q.get('token');

function log(cls, msg) {
  const d = document.createElement('div');
  d.className = cls; d.textContent = msg;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
function setState(s, cls) { stateEl.textContent = s; orb.className = 'orb' + (cls ? ' ' + cls : ''); }

// ── Continuous PCM playback via an inline AudioWorklet ring buffer ──
const PLAYER_WORKLET = `
class PCMQueue extends AudioWorkletProcessor {
  constructor() { super(); this.q = []; this.cur = null; this.pos = 0;
    this.port.onmessage = (e) => {
      if (e.data === 'flush') { this.q = []; this.cur = null; this.pos = 0; }
      else this.q.push(e.data);
    };
  }
  process(_, outputs) {
    const out = outputs[0][0]; let i = 0;
    while (i < out.length) {
      if (!this.cur || this.pos >= this.cur.length) {
        if (!this.q.length) { while (i < out.length) out[i++] = 0; break; }
        this.cur = this.q.shift(); this.pos = 0;
      }
      out[i++] = this.cur[this.pos++];
    }
    return true;
  }
}
registerProcessor('pcm-queue', PCMQueue);
`;

async function initPlayback() {
  playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_OUT });
  const url = URL.createObjectURL(new Blob([PLAYER_WORKLET], { type: 'application/javascript' }));
  await playCtx.audioWorklet.addModule(url);
  playNode = new AudioWorkletNode(playCtx, 'pcm-queue');
  playNode.connect(playCtx.destination);
}

function playChunk(b64) {
  if (!playNode) return;
  if (playCtx.state === 'suspended') playCtx.resume();
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const i16 = new Int16Array(bytes.buffer);
  const f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
  playNode.port.postMessage(f32);
}
function flushPlayback() { if (playNode) playNode.port.postMessage('flush'); }

// ── Mic capture via AudioWorklet, resampled to 16kHz inside the worklet ──
// ScriptProcessor + an unreferenced MediaStreamAudioSourceNode is the classic
// Chrome "all zeros" capture bug: Chrome GCs the source node and the audio
// silently goes to digital silence while the graph keeps ticking. So we keep a
// GLOBAL ref to the source, resume() the context, and use a worklet.
const CAPTURE_WORKLET = `
class PCM16Capture extends AudioWorkletProcessor {
  constructor() { super(); this.target = 16000; this.ratio = sampleRate / this.target;
    this.pos = 0; this.pending = []; this.chunk = []; this.chunkSize = 1600; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch || ch.length === 0) return true;
    for (let i = 0; i < ch.length; i++) this.pending.push(ch[i]);
    while (this.pos + 1 < this.pending.length) {
      const i0 = Math.floor(this.pos), f = this.pos - i0;
      const s = this.pending[i0] + (this.pending[i0 + 1] - this.pending[i0]) * f;
      const c = Math.max(-1, Math.min(1, s));
      this.chunk.push((c < 0 ? c * 0x8000 : c * 0x7fff) | 0);
      this.pos += this.ratio;
      if (this.chunk.length >= this.chunkSize) {
        const out = new Int16Array(this.chunk);
        this.port.postMessage(out.buffer, [out.buffer]);
        this.chunk = [];
      }
    }
    const consumed = Math.floor(this.pos);
    if (consumed > 0) { this.pending.splice(0, consumed); this.pos -= consumed; }
    return true;
  }
}
registerProcessor('pcm16-capture', PCM16Capture);
`;

async function startMic() {
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  await micCtx.resume();
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  const track = micStream.getAudioTracks()[0];
  const st = track.getSettings ? track.getSettings() : {};
  log('sys', `mic: "${track.label || '?'}" muted=${track.muted} enabled=${track.enabled} state=${track.readyState} rate=${st.sampleRate || micCtx.sampleRate}`);
  track.onmute = () => log('sys', '⚠ mic track MUTED by OS/another app');
  track.onunmute = () => log('sys', 'mic track unmuted');
  micSource = micCtx.createMediaStreamSource(micStream); // global ref → no GC
  const url = URL.createObjectURL(new Blob([CAPTURE_WORKLET], { type: 'application/javascript' }));
  await micCtx.audioWorklet.addModule(url);
  micNode = new AudioWorkletNode(micCtx, 'pcm16-capture');
  micNode.port.onmessage = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const i16 = new Int16Array(e.data);
    let peak = 0;
    for (let i = 0; i < i16.length; i++) { const a = Math.abs(i16[i]); if (a > peak) peak = a; }
    showLevel(peak / 32768);
    const bytes = new Uint8Array(e.data);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    ws.send(JSON.stringify({ type: 'audio', data: btoa(bin) }));
  };
  micSource.connect(micNode);
  micNode.connect(micCtx.destination);
}

let _lvlTick = 0;
function showLevel(peak) {
  // Throttle DOM updates; render a tiny bar so you can see your voice register.
  if ((_lvlTick++ & 3) !== 0) return;
  const bars = Math.min(20, Math.round(peak * 60));
  meterEl.textContent = '🎙 ' + '▮'.repeat(bars) + '▯'.repeat(20 - bars);
  meterEl.style.color = peak > 0.02 ? '#34a853' : '#555';
}

function stopAll() {
  if (micNode) { micNode.disconnect(); micNode = null; }
  if (micSource) { micSource.disconnect(); micSource = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micCtx) { micCtx.close().catch(() => {}); micCtx = null; }
  if (playNode) { playNode.disconnect(); playNode = null; }
  if (playCtx) { playCtx.close().catch(() => {}); playCtx = null; }
  if (ws) { try { ws.close(1000, 'user'); } catch {} ws = null; }
  connected = false; btn.textContent = 'Connect'; btn.classList.remove('stop');
}

async function connect() {
  const host = hostEl.value.trim(), port = portEl.value.trim() || '3002', token = tokenEl.value.trim();
  if (!host || !token) { log('sys', 'Need host + token.'); return; }
  localStorage.setItem('nemo_host', host);
  localStorage.setItem('nemo_port', port);
  localStorage.setItem('nemo_token', token);

  setState('connecting…'); logEl.innerHTML = '';
  try { await initPlayback(); } catch (e) { log('sys', 'playback init failed: ' + e); }

  // host may be a bare host (build scheme+port) or a full ws/wss URL (use as-is,
  // e.g. a Cloudflare tunnel: wss://xxx.trycloudflare.com).
  let url;
  if (/^wss?:\/\//i.test(host)) url = host;
  else url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${host}:${port}`;
  ws = new WebSocket(url);

  ws.onopen = () => { ws.send(JSON.stringify({ type: 'auth', token })); log('sys', 'socket open → sent auth'); };
  ws.onerror = () => { setState('connection error', 'error'); log('sys', 'WebSocket error (host/port reachable? wss needed?)'); };
  ws.onclose = (e) => {
    if (connected) log('sys', `disconnected (code ${e.code}${e.reason ? ' ' + e.reason : ''})`);
    setState('disconnected', connected ? 'error' : '');
    stopAll();
  };

  ws.onmessage = async (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    switch (m.type) {
      case 'ready':
        connected = true; btn.textContent = 'Disconnect'; btn.classList.add('stop');
        setState('listening — speak now', 'listening');
        try { await startMic(); } catch (e) { setState('mic blocked', 'error'); log('sys', 'mic error: ' + e); }
        break;
      case 'agent_audio_start': setState('Nemo speaking…', 'speaking'); break;
      case 'audio': playChunk(m.data); break;
      case 'turn_complete': setState('listening', 'listening'); break;
      case 'interrupted': flushPlayback(); setState('listening', 'listening'); break;
      case 'user_transcript': log('you', 'You: ' + m.data); break;
      case 'text': log('nemo', 'Nemo: ' + m.data); break;
      case 'error': setState('error', 'error'); log('sys', '⚠ ' + (m.message || 'error')); break;
    }
  };
}

btn.onclick = () => { connected || ws ? stopAll() : connect(); if (!ws) setState('idle'); };
</script>
</body>
</html>
